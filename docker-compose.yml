version: '3.8'

networks:
  cropdeal-net:
    driver: bridge

services:
  # =========================================================
  # INFRASTRUCTURE SERVICES
  # =========================================================
  config-server:
    build: ./config-server
    container_name: cropdeal-config-server
    restart: "no"
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - SPRING_PROFILES_ACTIVE=native
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    networks:
      - cropdeal-net

  eureka-server:
    build: ./eureka-server
    container_name: cropdeal-eureka-server
    restart: "no"
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    networks:
      - cropdeal-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cropdeal-rabbitmq
    restart: "no"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cropdeal-net

  api-gateway:
    build: ./api-gateway
    container_name: cropdeal-api-gateway
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - config-server
      - eureka-server
    networks:
      - cropdeal-net

  # =========================================================
  # CORE BUSINESS SERVICES (Connecting to Host Machine MySQL)
  # All configuration centralized in Spring Cloud Config Server
  # =========================================================
  auth-service:
    build: ./auth-service
    container_name: cropdeal-auth-service
    restart: "no"
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - config-server
      - eureka-server
    networks:
      - cropdeal-net

  user-service:
    build: ./user-sevice
    container_name: cropdeal-user-service
    restart: "no"
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - config-server
      - eureka-server
    networks:
      - cropdeal-net

  crop-service:
    build: ./crop-service
    container_name: cropdeal-crop-service
    restart: "no"
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx140m -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - config-server
      - eureka-server
    networks:
      - cropdeal-net

  price-service:
