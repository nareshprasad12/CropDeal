server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# --- Core Business Microservice Routes (Load-Balanced via Eureka) ---
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:lb://auth-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /oauth2/**, /login/oauth2/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${USER_SERVICE_URL:lb://user-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**, /api/farmers/**, /api/dealers/**, /api/delivery-partners/**, /api/reviews/**, /api/admin/**

spring.cloud.gateway.routes[2].id=crop-service
spring.cloud.gateway.routes[2].uri=${CROP_SERVICE_URL:lb://crop-service}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/crops, /api/crops/**

spring.cloud.gateway.routes[3].id=price-service
spring.cloud.gateway.routes[3].uri=${PRICE_SERVICE_URL:lb://price-service}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pricing/**, /api/prices, /api/prices/**

spring.cloud.gateway.routes[4].id=negotiation-service
spring.cloud.gateway.routes[4].uri=${NEGOTIATION_SERVICE_URL:lb://negotiation-service}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/negotiations/**

spring.cloud.gateway.routes[5].id=bidding-service
spring.cloud.gateway.routes[5].uri=${BIDDING_SERVICE_URL:lb://bidding-service}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/biddings/**, /api/bids/**, /api/bidding/**

spring.cloud.gateway.routes[6].id=wallet-service
spring.cloud.gateway.routes[6].uri=${WALLET_SERVICE_URL:lb://wallet-service}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/wallet/**, /api/wallets/**

spring.cloud.gateway.routes[7].id=order-service
spring.cloud.gateway.routes[7].uri=${ORDER_SERVICE_URL:lb://order-service}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[8].id=payment-service
spring.cloud.gateway.routes[8].uri=${PAYMENT_SERVICE_URL:lb://payment-service}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/payments/**, /api/refunds/**

spring.cloud.gateway.routes[9].id=invoice-service
spring.cloud.gateway.routes[9].uri=${INVOICE_SERVICE_URL:lb://invoice-service}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/invoices/**

spring.cloud.gateway.routes[10].id=delivery-service
spring.cloud.gateway.routes[10].uri=${DELIVERY_SERVICE_URL:lb://delivery-service}
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/deliveries/**,/api/delivery-agents/**

spring.cloud.gateway.routes[11].id=notification-service
spring.cloud.gateway.routes[11].uri=${NOTIFICATION_SERVICE_URL:lb://notification-service}
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[12].id=chatbot-service
spring.cloud.gateway.routes[12].uri=${CHATBOT_SERVICE_URL:lb://chatbot-service}
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/chat/**,/api/chatbot/**,/api/v1/chatbot/**

spring.cloud.gateway.routes[13].id=price-alert-service
spring.cloud.gateway.routes[13].uri=${PRICE_ALERT_SERVICE_URL:lb://price-alert-service}
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/price-alerts/**,/api/buying-requests/**

spring.cloud.gateway.routes[14].id=report-service
spring.cloud.gateway.routes[14].uri=${REPORT_SERVICE_URL:lb://report-service}
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/reports/**

