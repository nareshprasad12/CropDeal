# ===================================================================
# CENTRALIZED GLOBAL CROPDEAL CONFIGURATION (CONFIG SERVER - DOCKER)
# ===================================================================

# Eureka Service Discovery (Docker container hostname)
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT Security
jwt.secret=CropDealAuthServiceSecretKeyForJwtTokenGeneration2026Secure
jwt.expiration=86400000

# RabbitMQ AMQP Broker (Docker container hostname)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Shared MySQL Credentials (Windows Host MySQL via Docker bridge)
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actuator & Metrics Defaults
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger Documentation Defaults
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Server Forward Headers (API Gateway integration)
server.forward-headers-strategy=framework
