# =========================================================
# CENTRALIZED CONFIGURATION: price-alert-service
# =========================================================

spring.application.name=price-alert-service
server.port=${SERVER_PORT:8094}

# =========================================================
# MYSQL DATABASE CONFIGURATION
# =========================================================
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/cropdeal_price_alert_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA AND HIBERNATE CONFIGURATION
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# EUREKA CONFIGURATION
# =========================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================================================
# RABBITMQ CONFIGURATION
# =========================================================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}

cropdeal.rabbitmq.exchange=cropdeal.notification.exchange
cropdeal.rabbitmq.routing-key=price.alert

# =========================================================
# ACTUATOR & SWAGGER
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# PRICE SERVICE CLIENT & SCHEDULER
# =========================================================
# Query local database prices from price-service (no external government API calls)
price-service.url=http://price-service:8084
price-alert.check-db-interval-ms=3600000
