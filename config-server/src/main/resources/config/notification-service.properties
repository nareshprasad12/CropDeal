# =========================================================
# CENTRALIZED CONFIGURATION: notification-service
# =========================================================

spring.application.name=notification-service
server.port=${SERVER_PORT:8092}

# =========================================================
# MYSQL DATABASE CONFIGURATION
# =========================================================
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/cropdeal_notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA AND HIBERNATE CONFIGURATION
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# EUREKA CONFIGURATION
# =========================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================================================
# ACTUATOR & SWAGGER
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# MAIL CONFIGURATION
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mohantest0002@gmail.com
spring.mail.password=ckhekprpfdncikse
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =========================================================
# RABBITMQ CONFIGURATION
# =========================================================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
